networks:
  app:

services:
  pgsql:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PREFIX}-pgsql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PREFIX}-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app

  php:
    build: docker/php
    container_name: ${COMPOSE_PREFIX}-php
    working_dir: /var/www/app
    volumes:
      - ./laravel:/var/www/app
    depends_on:
      - pgsql
      - redis
    networks:
      - app

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PREFIX}-nginx
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app

  horizon:
    build: docker/php
    container_name: ${COMPOSE_PREFIX}-horizon
    command: php artisan horizon
    working_dir: /var/www/app
    volumes:
      - ./laravel:/var/www/app
    depends_on:
      - redis
      - php
    networks:
      - app

  frontend:
    build: frontend
    container_name: ${COMPOSE_PREFIX}-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app

volumes:
  pg_data:
    name: ${COMPOSE_PREFIX}_pg_data
  redis_data:
    name: ${COMPOSE_PREFIX}_redis_data
